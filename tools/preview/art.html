<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import * as A from '../../src/game/art.js';
import { parseLevel } from '../../src/engine/core.js';
const c = document.getElementById('c'); const W = 1000, H = 1400; c.width = W; c.height = H;
const g = c.getContext('2d');
const world = new URLSearchParams(location.search).get('w') || 'meadow';
const sky = A.renderSky(W, H, world); g.drawImage(sky, 0, 0);
A.drawStars(g, A.makeStars(150), W, H, 1, A.WORLD_STYLES[world].stars, 1.5);
const L = parseLevel({ id:'p', map:[
' ......',
'a..#..A',
'.~~..#.',
'.~...B.',
'... ...',
' ..*.. ',
], dirs:{a:'E'} });
const S = 96;
const isl = A.renderIsland(L, world, S, 1);
const ox = 100, oy = 120;
g.drawImage(isl.canvas, ox - isl.pad, oy - isl.pad);
const st = A.WORLD_STYLES[world];
let v = 0;
for (let y=0;y<L.h;y++) for (let x=0;x<L.w;x++) { if (L.terrain[y*L.w+x]===2) { const p = A.propSprite(st.props[(v++)%st.props.length], S, world, v, 1); g.drawImage(p.canvas, ox+(x+0.5)*S - p.ax, oy+(y+0.62)*S - p.ay, p.w, p.h);} }
A.drawLantern(g, ox+6.5*S, oy+1.62*S, S, 0, {lit:1, t:1});
A.drawLantern(g, ox+5.5*S, oy+3.62*S, S, 1, {lit:0, locked:true, t:1});
A.drawLumi(g, ox+0.5*S, oy+1.62*S, S, {color:0, dir:1, t:1});
A.drawArrowStone(g, ox+2.5*S, oy+0.5*S, S, 2, {});
A.drawArrowStone(g, ox+4.5*S, oy+0.5*S, S, 1, {fixed:true});
A.drawLily(g, ox+2.5*S, oy+2.5*S, S, {t:1});
A.drawFirefly(g, ox+3.5*S, oy+5.62*S, S, 1);
// gallery
let gx = 80, gy = 860;
for (let i=0;i<4;i++) A.drawLumi(g, gx + i*110, gy, S, {color:i, dir:[2,1,3,2][i], t:i, mood:['idle','happy','scared','sad'][i], hat: A.HATS[i+1], flame: i===3?0:1});
A.drawGloomnib(g, gx + 460, gy, S, {t:1, dir:2});
A.drawGloomnib(g, gx + 570, gy, S, {t:1, dir:2, sleeping:true});
A.drawLumi(g, gx + 680, gy, S, {color:1, dir:0, t:2});
A.drawLumi(g, gx + 790, gy, S, {color:3, dir:2, t:2, hat:'wizard'});
gy = 1040;
A.drawMushroom(g, gx, gy, S, {}); A.drawDaisy(g, gx+110, gy, S, {t:1}); A.drawSpark(g, gx+220, gy, S, 2, 1);
A.drawPortal(g, gx+330, gy-30, S, 0, 1); A.drawPortal(g, gx+440, gy-30, S, 1, 1);
A.drawPlate(g, gx+550, gy-30, S, 0, {lit:true}); A.drawBrambles(g, gx+660, gy-40, S, 0, 0, 1); A.drawBrambles(g, gx+770, gy-40, S, 1, 1, 1);
gy = 1220;
A.drawVane(g, gx, gy, S, 0.6, 1); A.drawCloud(g, gx+130, gy, S, 1); A.drawLantern(g, gx+260, gy+20, S, 2, {lit:1, home:true, t:1}); A.drawLantern(g, gx+370, gy+20, S, 3, {lit:0.2, t:1});
const kinds = ['bush','rock','tree','flowers','reeds','stump','bigshroom','fern','pillar','brokenpillar','block','darktree','thorns','pine','snowrock','crystal'];
kinds.forEach((k,i)=>{ const p = A.propSprite(k, 56, world, i, 1); g.drawImage(p.canvas, 470 + (i%8)*62 - p.ax + 28, 1190 + Math.floor(i/8)*100 - p.ay + 60, p.w, p.h); });
window.done = true;
</script></body></html>
