<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Lumignons</title>
    <meta name="description" content="Lumignons — un jeu de réflexion : place des flèches pour guider de petites lueurs jusqu’à leurs lanternes." />
    <meta name="theme-color" content="#231a45" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumignons" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="preload" href="assets/fonts/fredoka-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <canvas id="view" aria-hidden="true"></canvas>

    <main id="ui">
      <section class="screen" id="screen-title" aria-label="Lumignons"></section>
      <section class="screen" id="screen-map" aria-label="Carte"></section>
      <section class="screen" id="screen-atelier" aria-label="Atelier"></section>
      <section class="screen" id="screen-editor" aria-label="Éditeur"></section>
      <section class="screen" id="screen-game" aria-label="Niveau">
        <header class="hud-top">
          <button class="icon-btn" data-act="pause" aria-label="Pause">
            <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" /></svg>
          </button>
          <button class="level-chip" data-act="goals">
            <span class="lv-num"></span>
            <span class="lv-name"></span>
          </button>
          <div class="goal-chips">
            <span class="chip chip-fireflies" title="Lucioles"><i class="ico-firefly"></i><b class="ff-count">0/0</b></span>
            <span class="chip chip-pieces" title="Pièces"><i class="ico-piece"></i><b class="pc-count">0</b><small class="pc-par"></small></span>
          </div>
        </header>
        <div class="hud-bottom">
          <div class="tray" role="toolbar"></div>
          <div class="controls">
            <button class="ctl" data-act="undo" aria-label="Annuler"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg><span class="lbl" data-t="undo"></span></button>
            <button class="ctl" data-act="reset" aria-label="Tout retirer"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" /></svg><span class="lbl" data-t="reset"></span></button>
            <button class="ctl" data-act="hint" aria-label="Indice"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3Z" /></svg><span class="lbl" data-t="hint"></span></button>
            <button class="ctl speed" data-act="speed" aria-label="Vitesse"><svg viewBox="0 0 24 24"><path d="m5 6 7 6-7 6zM12 6l7 6-7 6z" /></svg><span class="lbl spd">×1</span></button>
            <button class="ctl runctl" data-act="playpause" aria-label="Pause"><svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg><svg class="i-resume" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg><span class="lbl" data-t="pause"></span></button>
            <button class="ctl runctl" data-act="step" aria-label="Pas à pas"><svg viewBox="0 0 24 24"><path d="M6 5v14l9-7zM18 5v14" /></svg><span class="lbl" data-t="step"></span></button>
            <button class="go-btn" data-act="go"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg><svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg><span class="go-lbl"></span></button>
          </div>
        </div>
        <div class="fail-banner" role="status">
          <div class="fail-text"><b class="fail-title"></b><span class="fail-sub"></span></div>
          <div class="fail-actions">
            <button class="btn btn-ghost btn-small" data-act="replay-fail"></button>
            <button class="btn btn-primary" data-act="retry"></button>
          </div>
        </div>
      </section>
    </main>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="info-bubble" role="tooltip"></div>
    <noscript>Lumignons a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
